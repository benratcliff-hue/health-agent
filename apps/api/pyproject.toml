[project]
name = "health-api"
version = "0.0.0"
description = "FastAPI backend for Personal Health Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "pyjwt>=2.8",
    "procrastinate>=3.0",
    "health-db",
    "health-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_api"]
