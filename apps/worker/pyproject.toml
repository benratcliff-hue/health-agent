[project]
name = "health-worker"
version = "0.0.0"
description = "Procrastinate background worker for Personal Health Agent"
requires-python = ">=3.12"
# Procrastinate is a Postgres-backed task queue (no Redis). Verified actively
# maintained: latest release 3.8.1 on 2026-04-08. Floor at 3.0 for the modern API.
dependencies = [
    "procrastinate>=3.0",
    "httpx>=0.27",
    "health-db",
    "health-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_worker"]
