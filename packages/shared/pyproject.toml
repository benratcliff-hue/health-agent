[project]
name = "health-shared"
version = "0.0.0"
description = "Shared types, constants, and prompt templates for Personal Health Agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "anthropic>=0.40",
    "boto3>=1.34",
    "health-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_shared"]
