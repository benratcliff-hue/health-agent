[project]
name = "health-db"
version = "0.0.0"
description = "Database engine, SQLAlchemy models, and migrations for Personal Health Agent"
requires-python = ">=3.12"
# SQLAlchemy 2.x is the current major line; psycopg 3 is the maintained driver and is
# also what Procrastinate uses, so the whole repo speaks one Postgres driver.
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_db"]
