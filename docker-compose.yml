# Local development Postgres only. In production, Railway provides the managed
# Postgres service; this file is never deployed. Start it with `make dev` (or
# `docker compose up -d db`) so the api's /db-ping has a database to talk to.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
      POSTGRES_DB: health
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
